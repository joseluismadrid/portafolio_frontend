<section class="projects">
  <h1 class="projects__title">Proyectos</h1>

  <div class="projects__grid">
    @for (project of proyecto; track $index) {
      <article class="project-card">
        <header class="project-card__header">
          <h2>{{ project.titulo }}</h2>
        </header>

        <p class="project-card__description">
          {{ project.descripcion }}
        </p>
        <div class="project-card__technologies">
          @for (tech of project.tecnologias; track $index) {
            <span class="technology-badge">
              {{ tech }}
            </span>
          }
        </div>
        <div class="project-card__notice">
          <svg
            class="project-card__notice-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>

          <span class="project-card__notice-text">
            {{ project.estado }}
          </span>
        </div>
      </article>
    }
  </div>
</section>
