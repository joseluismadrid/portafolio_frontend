<section class="about" id="about">
  <h1>Sobre mí</h1>

  <p>{{ about }}</p>
</section>

<section class="technologies" id="technologies">
  <h2>Tecnologías</h2>

  <div class="tech-grid">
    @for (data of tecnologias; track data.titulo) {
      <div class="tech-card">
        <img
          [src]="data.imagen"
          [alt]="data.titulo"
          loading="lazy"
          decoding="async"
          width="48"
          height="48"
        />
        <span>{{ data.titulo }}</span>
      </div>
    }
  </div>
</section>
