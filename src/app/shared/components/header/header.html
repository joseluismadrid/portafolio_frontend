<header>
  <div class="logo">
    <a routerLink="/home" routerLinkActive="active">
      <img src="assets/img/logo.svg" alt="Logo" width="50" height="50" loading="eager" decoding="async" fetchpriority="high">
    </a>
  </div>

  <button class="hamburger" (click)="toggleMenu()" [class.open]="menuOpen" aria-label="Toggle menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="menu" [class.open]="menuOpen" aria-label="Navegación principal">
    <ul>
      <li><a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()">Inicio</a></li>
      <li><a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">Sobre mi</a></li>
      <li><a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Proyectos</a></li>
      <li><a routerLink="/skills" routerLinkActive="active" (click)="closeMenu()">Habilidades</a></li>
      <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contacto</a></li>
    </ul>
  </nav>
</header>
